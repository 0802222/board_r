name: Deploy to Staging

on:
  push:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/board-staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Staging Server (docker-compose)
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          DB_USER: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASS: ${{ secrets.STAGING_DB_PASSWORD }}
          JWT_SEC: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS: ${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR,REGISTRY,IMAGE_NAME,DB_URL,DB_USER,DB_PASS,JWT_SEC,JWT_ACCESS,JWT_REFRESH,MAIL_USERNAME,MAIL_PASSWORD
          script: |
            set -e
            cd ~
            printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # docker compose v2 / docker-compose v1 자동 감지
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # .env 파일 생성 (printf 사용: 특수문자/백슬래시가 echo 로 변형되는 것 방지)
            umask 077
            {
              printf 'JDBC_DATABASE_URL=%s\n' "$DB_URL"
              printf 'JDBC_DATABASE_USERNAME=%s\n' "$DB_USER"
              printf 'JDBC_DATABASE_PASSWORD=%s\n' "$DB_PASS"
              printf 'JWT_SECRET=%s\n' "$JWT_SEC"
              printf 'JWT_ACCESS_EXPIRATION=%s\n' "$JWT_ACCESS"
              printf 'JWT_REFRESH_EXPIRATION=%s\n' "$JWT_REFRESH"
              printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME"
              printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD"
            } > .env

            # 최신 스테이징 이미지 받아오기
            docker pull "$REGISTRY/$IMAGE_NAME:latest"

            # 재배포 (.env 파일 사용)
            $DC down
            $DC up -d

            # 헬스 체크 (POSIX sh 호환 루프: {1..12} 는 bash 전용이라 sh 에서는 검사 없이 통과할 수 있음)
            echo "Waiting for app to be healthy..."
            MAX=24
            i=1
            while [ "$i" -le "$MAX" ]; do
              if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
                echo "Staging app is healthy"
                break
              fi

              if [ "$i" -eq "$MAX" ]; then
                echo "Health check failed on staging"
                $DC logs --tail=50
                exit 1
              fi

              echo "Retry $i/$MAX..."
              i=$((i + 1))
              sleep 5
            done

            docker image prune -af
